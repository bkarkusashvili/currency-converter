<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convert currencies at Monobank rates, with the rate source and strategy shown for every conversion."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1113" />
    <script>
      // The theme, before the bundle: an explicit choice is on <html> for the
      // first paint instead of one frame after it. The key, the attribute and
      // the two values it accepts are src/theme's, and
      // src/theme/__tests__/prePaintScript.test.ts holds the two copies in step.
      (function () {
        try {
          var theme = localStorage.getItem('currency-converter:theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (error) {
          // Storage blocked or unavailable: prefers-color-scheme still applies.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Currency Converter</title>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
