# nginx replaces inherited add_header directives rather than merging them, so a
# location that sets any header of its own must set all of them. Keeping the set
# in one file included per location is what stops the two from drifting apart.
#
# This file is a template: the entrypoint renders ${CSP_API_ORIGIN} from API_URL
# at container start (docker/40-write-app-config.sh), so one image can be pointed
# at any API without rebuilding the policy that lets the browser reach it.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;

# The only inline script is the theme applied before the first paint, allowed by
# the hash of its exact contents — src/theme/__tests__/prePaintScript.test.ts
# fails when index.html and this hash part company. Everything else the page
# loads is same-origin, except Google Fonts (the stylesheet and the files it
# pulls) and the API, whose origin is templated in below.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-XS5vqVh/tZSRTS75gpGWkBnhhd0tSbGavwceLbSKvC4='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ${CSP_API_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
