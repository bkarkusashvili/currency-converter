# Overlay for running the apps from npm against containerised backing services:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Redis and Mongo publish their ports on the host loopback only — both run
# unauthenticated, so binding 0.0.0.0 would serve them to any shared network.
# The api and web containers move behind a profile so they stay out of `up`
# unless asked for explicitly. `--profile` is a global flag, so it goes before
# the subcommand:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     --profile containers up -d
#
# or COMPOSE_PROFILES=containers in the environment.
services:
  api:
    profiles: ['containers']

  web:
    profiles: ['containers']

  redis:
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'

  mongo:
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
