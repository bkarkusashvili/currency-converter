# Overlay for running the apps from npm against containerised backing services:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Redis and Mongo publish their ports on the host, and the api and web
# containers move behind a profile so they stay out of `up` unless asked for
# explicitly (`--profile containers`).
services:
  api:
    profiles: ['containers']

  web:
    profiles: ['containers']

  redis:
    ports:
      - '${REDIS_PORT:-6379}:6379'

  mongo:
    ports:
      - '${MONGO_PORT:-27017}:27017'
