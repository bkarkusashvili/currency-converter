name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing left to prove.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each app is an independent npm package with its own lockfile, so every job
  # here is self-contained: apps/web gets a sibling job with its own
  # working-directory and cache key.
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --coverage

      - name: E2E tests
        run: npm run test:e2e

      # The image is a deliverable of this package, so a Dockerfile that no
      # longer builds has to fail here rather than at deploy time.
      - name: Docker image
        run: docker build -t currency-api:ci .

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # The image is a deliverable of this package, so a Dockerfile that no
      # longer builds has to fail here rather than at deploy time.
      - name: Docker image
        run: docker build -t currency-web:ci .

  # The root package and the deployment descriptors belong to neither app, so
  # nothing above would catch a compose file that stopped parsing, a root
  # lockfile out of sync, or a railway.json typo. Config validation only — no
  # image builds, so it stays a few seconds long.
  orchestration:
    name: orchestration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Compose config
        run: docker compose -f docker-compose.yml config -q

      - name: Compose config (dev overlay)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Railway config
        run: |
          node -e "JSON.parse(require('fs').readFileSync('apps/api/railway.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps/web/railway.json', 'utf8'))"
