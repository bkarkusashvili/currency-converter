name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing left to prove.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each app is an independent npm package with its own lockfile, so every job
  # here is self-contained: apps/web gets a sibling job with its own
  # working-directory and cache key.
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --coverage

      - name: E2E tests
        run: npm run test:e2e

      # The image is a deliverable of this package, so a Dockerfile that no
      # longer builds has to fail here rather than at deploy time.
      - name: Docker image
        run: docker build -t currency-api:ci .

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # The image is a deliverable of this package, so a Dockerfile that no
      # longer builds has to fail here rather than at deploy time.
      - name: Docker image
        run: docker build -t currency-web:ci .

  # The root package and the deployment descriptors belong to neither app, so
  # nothing above would catch a compose file that stopped parsing, a root
  # lockfile out of sync, or a railway.json typo.
  #
  # Parsing is not enough on its own: a stack that parses and then refuses to
  # start — a variable the API's schema requires and Compose never sets, a
  # healthcheck pointed at a route that does not exist — is exactly the class of
  # regression the config checks cannot see. So the job also runs the stack. It
  # builds both images, which is the cost; `--wait` then does most of the work,
  # since it only returns once every healthcheck in the file passes.
  orchestration:
    name: orchestration
    runs-on: ubuntu-latest
    # The stack itself is the slow part, and a hang must not sit here for the
    # default six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Compose config
        run: docker compose -f docker-compose.yml config -q

      - name: Compose config (dev overlay)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Railway config
        run: |
          node -e "JSON.parse(require('fs').readFileSync('apps/api/railway.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps/web/railway.json', 'utf8'))"

      # No ADMIN_API_KEY in the environment: the compose file's own default is
      # what has to carry a stack the API runs as NODE_ENV=production, where the
      # schema refuses to start without one. Setting it here would hide exactly
      # the regression this step exists to catch.
      - name: Start the stack
        run: docker compose up --build -d --wait

      # The deploy gate and the container healthcheck both probe this one, so a
      # route that stopped existing has to fail here rather than at rollout.
      - name: Liveness answers
        run: curl -fsS localhost:3000/health/live

      # /health is allowed to answer 503 when a dependency is down; in this job
      # all four are up and waited for, so anything but 200 with all three
      # indicators present is a real failure.
      - name: Every dependency reports up
        run: |
          report=$(curl -fsS localhost:3000/health)
          echo "$report"
          node -e '
            const report = JSON.parse(process.argv[1]);
            const details = report.details ?? {};
            for (const key of ["redis", "mongodb", "monobank"]) {
              if (details[key]?.status !== "up") {
                throw new Error(`${key} is not up: ${JSON.stringify(details)}`);
              }
            }
          ' "$report"

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
