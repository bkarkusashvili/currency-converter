name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing left to prove.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each app is an independent npm package with its own lockfile, so every job
  # here is self-contained: apps/web gets a sibling job with its own
  # working-directory and cache key.
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --coverage

      - name: E2E tests
        run: npm run test:e2e

      # Clean today, and a dependency that stops being clean should be visible
      # here rather than only at the next person to look. After the tests,
      # because it is the one step whose result does not depend on the diff:
      # an advisory published this morning, or a registry that is briefly
      # unreachable, would otherwise fail a green PR before anything had been
      # run and would say something about a transitive dependency while doing
      # it. Advisory rather than blocking for the same reason: it is published
      # against a lockfile the PR did not touch, so a PR with an unrelated diff
      # should not go red for it. The blocking check lives in the weekly
      # audit.yml workflow instead.
      - name: Audit (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # The image is a deliverable of this package, so a Dockerfile that no
      # longer builds has to fail here rather than at deploy time.
      - name: Docker image
        run: docker build -t currency-api:ci .

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # After the tests, and advisory rather than blocking, for the reason the
      # api job gives.
      - name: Audit (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # The image is a deliverable of this package, so a Dockerfile that no
      # longer builds has to fail here rather than at deploy time.
      - name: Docker image
        run: docker build -t currency-web:ci .

  # The root package and the deployment descriptors belong to neither app, so
  # nothing above would catch a compose file that stopped parsing, a root
  # lockfile out of sync, or a railway.json typo.
  #
  # Parsing is not enough on its own: a stack that parses and then refuses to
  # start — a variable the API's schema requires and Compose never sets, a
  # healthcheck pointed at a route that does not exist — is exactly the class of
  # regression the config checks cannot see. So the job also runs the stack. It
  # builds both images, which is the cost; `--wait` then does most of the work,
  # since it only returns once every healthcheck in the file passes.
  orchestration:
    name: orchestration
    runs-on: ubuntu-latest
    # The stack itself is the slow part, and a hang must not sit here for the
    # default six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # The API's lockfile too: the integration suite below runs from
          # apps/api, so its dependencies are installed in this job as well.
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json

      - name: Install
        run: npm ci

      # The golden fixtures are read by two suites in two apps and belong to
      # neither, so this is the job that owns them. Cheap, and it runs before
      # anything is built: a vector against a currency the snapshot does not
      # quote would otherwise fail as eight identical assertions in two jobs.
      - name: Shared fixtures
        run: npm run check:fixtures

      - name: Compose config
        run: docker compose -f docker-compose.yml config -q

      - name: Compose config (dev overlay)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Railway config
        run: |
          node -e "JSON.parse(require('fs').readFileSync('apps/api/railway.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps/web/railway.json', 'utf8'))"

      # No ADMIN_API_KEY in the environment: the compose file's own default is
      # what has to carry a stack the API runs as NODE_ENV=production, where the
      # schema refuses to start without one. Setting it here would hide exactly
      # the regression this step exists to catch.
      #
      # The dev overlay is layered on so Redis and Mongo publish on the host
      # loopback, which is what lets the integration suite below reach them.
      # `--profile containers` comes with it: the overlay moves api and web
      # behind that profile for the run-the-apps-from-npm case, and without it
      # the stack this job exists to start would be two backing services.
      - name: Start the stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml \
            --profile containers up --build -d --wait

      # The deploy gate and the container healthcheck both probe this one, so a
      # route that stopped existing has to fail here rather than at rollout.
      - name: Liveness answers
        run: curl -fsS localhost:3000/health/live

      # /health is allowed to answer 503 when a dependency is down; in this job
      # all four are up and waited for, so anything but 200 with all three
      # indicators present is a real failure.
      - name: Every dependency reports up
        run: |
          report=$(curl -fsS localhost:3000/health)
          echo "$report"
          node -e '
            const report = JSON.parse(process.argv[1]);
            const details = report.details ?? {};
            for (const key of ["redis", "mongodb", "monobank"]) {
              if (details[key]?.status !== "up") {
                throw new Error(`${key} is not up: ${JSON.stringify(details)}`);
              }
            }
          ' "$report"

      # The one seam the unit and e2e suites cannot take: every other test of
      # the Redis and Mongo adapters runs against a hand-written fake, which
      # can only confirm the assumption its author had. These run the same two
      # adapters against the real servers the stack just started — the TTLs the
      # cache is actually written with, the index Mongo actually holds, the
      # order the page actually comes back in. They skip visibly anywhere the
      # two URLs are not set, so a laptop and the `api` job stay unaffected.
      - name: Install the API for the integration suite
        run: npm ci --prefix apps/api

      - name: Integration tests against the running stack
        working-directory: apps/api
        env:
          INTEGRATION_REDIS_URL: redis://127.0.0.1:6379
          INTEGRATION_MONGO_URL: mongodb://127.0.0.1:27017/currency_converter_integration
        run: npm run test:integration

      - name: Stack logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml \
            --profile containers logs --no-color

      - name: Stop the stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml \
            --profile containers down -v
